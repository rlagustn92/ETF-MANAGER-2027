# Streamlit 화면 설정. (비밀값은 같은 폴더의 secrets.toml -- 저장소에 안 올라갑니다)
#
# 왜 밝은 테마로 고정하나
# ----------------------
# Streamlit 은 기본적으로 **보는 사람의 기기 설정**을 따라갑니다. 그래서 폰이나 PC 가
# 다크 모드면 배경이 검게 바뀌는데, 이 앱의 글자색(ui_theme.py 의 잉크 체계)은
# 짙은 네이비 하나로 짜여 있습니다. 그 상태가 되면
#
#     짙은 네이비 글자  +  거의 검은 배경  =  아무것도 안 보임
#
# 이 됩니다. 실제로 확인했더니 숫자도 이름표도 읽을 수가 없었습니다.
# 폰 사용자 중 다크 모드를 쓰는 사람이 많아서 그냥 두면 꽤 많은 사람이
# "앱이 고장났다" 고 느낍니다.
#
# 제대로 된 해결은 밝은/어두운 두 벌의 색을 다 만드는 것입니다(전술판 컴포넌트와
# 캡처 이미지까지 포함해서). 그건 큰 작업이라, 그 전까지는 **밝은 테마로 고정**해서
# 최소한 읽히게 둡니다.
[theme]
base = "light"

[browser]
gatherUsageStats = false
